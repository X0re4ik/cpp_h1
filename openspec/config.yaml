schema: spec-driven

# Подробный контекст проекта вынесен в openspec/context/ — читай файлы оттуда.
context: |
  ## Проект h1 — консольный калькулятор на C++20 (учебный, ДЗ-2/ДЗ-3)

  Консольное приложение: принимает операцию JSON-строкой через CLI, считает,
  печатает результат, сохраняет историю в PostgreSQL и кеш. C++20, clang++,
  CMake 3.22+.

  ### Обязательно перед работой над спекой прочитай артефакты проекта
  (все пути от корня репозитория, см. полный индекс в openspec/context/README.md):
  - openspec/context/architecture.md — модули, namespace, поток выполнения,
    зависимости (читать всегда);
  - openspec/context/coding-standards.md — правила формирования .hpp/.cpp,
    стиль, именование (читать всегда);
  - openspec/context/build-and-verification.md — сборка, запуск, тесты,
    clang-format/clang-tidy/valgrind, правки CMakeLists.txt;
  - openspec/context/constraints.md — обязательные ограничения ДЗ (запреты)
    и известные недоработки из docs/task3_check.md.
  - openspec/context/change-workflow.md — изменения как миграции: имя change
    обязано иметь формат NNNN-<hash>-<kebab-name>, номера строго по возрастанию
    (новый change — ниже текущего, max+1), хеш уникален; читать ПЕРЕД созданием
    нового change.

  ### Первоисточники в репозитории
  - README.md, docs/task2.md, docs/task3.md, docs/task3_check.md — задания и
    статус их выполнения;
  - CMakeLists.txt (исходники/тесты/зависимости), Makefile (команды);
  - .clang-format, .clang-tidy — стиль и статический анализ.

# Per-artifact rules
rules:
  proposal:
    - Пиши артефакты на русском языке
    - "Имя нового change задавай в миграционном формате NNNN-<hash>-<kebab-name> (см. openspec/context/change-workflow.md): номер = max(существующих в openspec/changes/ и archive/)+1, строго по возрастанию — новый change располагается ниже текущего; 8-символьный hex-хеш уникален среди всех изменений, номер и хеш не переиспользуются"
    - Опирайся на модульную архитектуру из openspec/context/architecture.md, не изобретай новую структуру
    - Соблюдай ограничения из openspec/context/constraints.md
  design:
    - Указывай затрагиваемые модули (include/h1/<module>, src/<module>) и изменения в CMakeLists.txt (списки исходников, тестов)
    - Следуй правилам из openspec/context/coding-standards.md
  tasks:
    - Включай шаги проверки из openspec/context/build-and-verification.md (сборка, ctest, clang-format-fix, clang-tidy-check, valgrind при изменениях владения ресурсами)
    - Новые тестовые файлы обязательно добавлять в add_executable(h1_test ...) в CMakeLists.txt
    - "Завершай список задач отдельной задачей: составить для пользователя полный отчет о цикле изменений (что сделано, полный список затронутых файлов с кратким описанием изменений, добавленные тесты, команды самостоятельной проверки)"
    - "После задачи-отчета добавляй финальную задачу — передать пользователю минимум 5 ручных проверочных кейсов (smoke-сценарии с командами и ожидаемым результатом) и получить подтверждение их прогона. Архивация change возможна только после выполнения этой задачи"
    - "Ручные проверочные кейсы обязательно сохраняются в файл openspec/changes/<change-name>/manual-tests.md (пререквизиты, кейсы с командами и ожидаемым результатом, чеклист прогона для человека); в списке задач должна быть задача на создание этого файла и задача на подтверждение прогона по нему — архивация change возможна только после обеих"
  specs:
    - Требования формулируй по наблюдаемому поведению (CLI, вывод, БД, кеш), не по деталям реализации

# Per-operation guidance
operations:
  apply:
    guidance:
      - "ПЕРЕД началом реализации задай пользователю минимум 5 уточняющих вопросов и дождись ответов, чтобы ожидания от результата совпали. Обязательно покрой три темы: (1) ЧТО нужно сделать — уточни объем, приоритеты и границы изменения; (2) КАК это сделать — предложи свой подход и подтверди его, рассмотри альтернативы, где это уместно; (3) КАК будем проверять, что все работает корректно — согласуй критерии приемки и способы проверки (тесты, ctest, valgrind, clang-tidy, ручной сценарий запуска). Если по какой-то теме вопросов меньше пяти, задай дополнительные по темам: поведение в граничных случаях, влияние на существующие модули/интерфейсы, производительность и обработка ошибок."
      - "Не начинай писать код до ответов пользователя на заданные вопросы. Если пользователь просит продолжить без ответов — переспроси явно."
      - "Проблемы ВНЕ контекста текущего change (например, существовавшие ранее ошибки clang-tidy, тестов, сборки, стиля в файлах, которые изменение не затрагивает) НЕ исправляются в рамках этого change — даже если они мешают 'зеленому' прогону. Агент обязан (1) зафиксировать факт в примечании к задаче в tasks.md, (2) указать их в отчете о цикле изменений, (3) продолжить только согласованный scope. Любые правки кода вне scope — СТРОГО после явного согласования с ВЛАДЕЛЬЦЕМ проекта (явное подтверждение пользователя на конкретный набор правок). Без согласования предлагай оформить отдельный change по миграционным правилам openspec/context/change-workflow.md."
      - "В конце работы представь пользователю полный цикл изменений: что было сделано по каждой задаче, полный список затронутых файлов (созданы/изменены) с кратким описанием изменений в каждом, добавленные тесты и команды, которые пользователь может выполнить для самостоятельной проверки."
      - "В финальном отчете ОБЯЗАТЕЛЬНО приложить минимум 5 ручных проверочных кейсов (smoke-сценарии) для человека, прогон которого дает уверенность, что change рабочий. Каждый кейс: (а) название и что проверяет; (б) точная команда(ы) для выполнения; (в) ожидаемый наблюдаемый результат. Кейсы должны покрывать: основную функциональность change, граничные/ошибочные сценарии, метаданные или состояние системы (файлы/БД/пакеты), а также действия по откату/удалению, если применимо. Это обязательный артефакт change: без этих кейсов change считается непроверенным."
      - "Ручные проверочные кейсы ОБЯЗАТЕЛЬНО оформляются в отдельный файл openspec/changes/<change-name>/manual-tests.md — самодостаточная инструкция для человека: (1) пререквизиты (docker/БД, .env, sudo-команды, окружение); (2) каждый кейс с названием, описанием что проверяет, точными командами и ожидаемым результатом; (3) чеклист `- [ ]` в конце файла, который человек отмечает по ходу прогона. Файл создается при реализации change (не позже финального отчета), переархивируется вместе с change и служит источником правды о том, как проверять этот change руками."
  archive:
    guidance:
      - "БЛОКЕР архивации: перед архивацией агент ОБЯЗАН запросить у пользователя подтверждение, что ручные проверочные кейсы (минимум 5 smoke-сценариев) реально прогнаны человеком по файлу openspec/changes/<change-name>/manual-tests.md. Без явного подтверждения владельца change НЕ архивируется и НЕ переводится в done — агент приостанавливает архивацию, повторно приводит список кейсов из manual-tests.md и ждет. Если файл manual-tests.md отсутствует в change — архивация также блокируется: сначала создать файл с кейсами. Если пользователь просит архивировать без прогона кейсов — агент обязан явно переспросить: подтвердить пропуск обязательных ручных проверок, и архивировать только после повторного явного согласия; факт пропуска фиксируется в резюме архивации."
      - "В итоговом резюме архивации перечисли полный список затронутых файлов и итоговый прогон проверок (сборка, ctest, clang-tidy, valgrind)"
      - "В резюме архивации укажи, какие ручные кейсы были прогнаны пользователем и подтверждены (или зафиксируй задокументированный пропуск)"
