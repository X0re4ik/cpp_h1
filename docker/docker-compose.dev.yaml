services:
  postgres:
    image: postgres:16
    container_name: my-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword

    ports:
      - "5432:5432"

    volumes:
      - postgres_data2223322:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data2223322:
